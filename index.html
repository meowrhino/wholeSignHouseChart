<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>carta natal whole sign — meowrhino studio</title>
  <meta name="description" content="carta natal whole sign: la rueda, los planetas con su dignidad, los aspectos por signos y las casas. de día o de noche. hecha por meowrhino studio.">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="apple-touch-icon" href="favicon/apple-touch-icon.png">
  <script>
    // la carta tiene dos caras: día (blanca) y noche (negra). manda la que eligió la persona con el enlace
    // día/noche; si no eligió, la del modo claro u oscuro de su sistema. la carta va en la url y se conserva.
    let cara; try { cara = localStorage.getItem('astro-cara'); } catch (_) { }
    if (cara !== 'dia' && cara !== 'noche') cara = matchMedia('(prefers-color-scheme: dark)').matches ? 'noche' : 'dia';
    location.replace(cara + '/' + location.search);
  </script>
  <style>
    body { margin: 0; padding: 24px; font: 15px/1.5 Georgia, serif; text-transform: lowercase; }
    a { color: inherit; }
    @media (prefers-color-scheme: dark) { body { background: #000; color: #fff; } }
  </style>
</head>

<body>
  <noscript><p>carta natal: <a href="dia/">de día</a> · <a href="noche/">de noche</a></p></noscript>
</body>

</html>
